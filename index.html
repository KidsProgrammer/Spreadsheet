<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Google Sheets - Dark Mode</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts Roboto -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
  
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Roboto', 'sans-serif'],
          },
          colors: {
            sheetDark: {
              900: '#111315', // Main app background
              800: '#1b1d20', // Surface / Card bg
              700: '#282a2d', // Headers & Bars
              600: '#383b40', // Borders & Grid lines
              500: '#53575e', // Subtle border
            },
            accentCyan: {
              DEFAULT: '#78d9ec', // Google Sheets Android Teal/Cyan Pill
              dark: '#004d61',
              text: '#003640',
            },
            sheetsGreen: '#0fa958' // Google Sheets Green
          }
        }
      }
    }
  </script>

  <style>
    /* Custom Scrollbar for Spreadsheet Grid */
    ::-webkit-scrollbar {
      width: 10px;
      height: 10px;
    }
    ::-webkit-scrollbar-track {
      background: #1b1d20;
    }
    ::-webkit-scrollbar-thumb {
      background: #383b40;
      border-radius: 5px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #53575e;
    }

    .cell-selected {
      outline: 2px solid #78d9ec !important;
      outline-offset: -2px;
      background-color: rgba(120, 217, 236, 0.08) !important;
      z-index: 10;
    }

    /* Fixed table styling */
    .grid-table {
      border-collapse: separate;
      border-spacing: 0;
    }
    .grid-cell {
      border-right: 1px solid #2d3034;
      border-bottom: 1px solid #2d3034;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      user-select: none;
    }
    .grid-cell:focus {
      outline: none;
    }
    .header-cell {
      border-right: 1px solid #383b40;
      border-bottom: 1px solid #383b40;
      background-color: #1b1d20;
      color: #9aa0a6;
      font-size: 11px;
      font-weight: 500;
      user-select: none;
    }
  </style>
</head>
<body class="bg-sheetDark-900 text-[#e3e3e3] font-sans antialiased h-screen w-screen overflow-hidden select-none">

  <!-- ========================================== -->
  <!-- VIEW 1: DASHBOARD / FILES VIEW             -->
  <!-- ========================================== -->
  <div id="dashboardView" class="h-full w-full flex flex-col">
    <!-- Top Search Header (No 'R' logo) -->
    <header class="p-3 sm:px-6 sm:py-4 flex items-center justify-between gap-3 border-b border-sheetDark-800">
      <div class="flex items-center gap-3 flex-1 max-w-3xl">
        <button onclick="toggleSideMenu()" class="p-2.5 rounded-full hover:bg-sheetDark-700 text-[#c4c7c5]" title="Main menu">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>
        <!-- Search bar -->
        <div class="flex-1 flex items-center bg-sheetDark-800 rounded-full px-4 py-2 text-sm border border-transparent focus-within:border-accentCyan focus-within:bg-[#1f2124] transition-all">
          <svg class="w-5 h-5 text-[#8e918f] mr-3" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
          <input type="text" id="searchInput" placeholder="Search spreadsheets" oninput="renderDashboard()" class="bg-transparent border-none outline-none w-full text-[#e3e3e3] placeholder-[#8e918f] text-sm">
          <button title="Open file picker" class="p-1 rounded-full text-[#c4c7c5] hover:bg-sheetDark-700 ml-1">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z"/></svg>
          </button>
        </div>
      </div>
      
      <!-- Desktop Quick New Button -->
      <button onclick="createNewSpreadsheet()" class="hidden sm:flex items-center gap-2 bg-[#1f2b30] border border-[#2b4b52] hover:bg-[#253940] text-accentCyan px-4 py-2 rounded-full font-medium text-sm transition-colors">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/></svg>
        <span>Blank spreadsheet</span>
      </button>
    </header>

    <!-- Sub Toolbar: Sort & Layout toggles -->
    <div class="px-4 sm:px-8 py-3 flex items-center justify-between text-sm text-[#c4c7c5]">
      <div class="flex items-center gap-2 cursor-pointer hover:text-white" onclick="toggleSort()">
        <span id="sortLabel" class="font-medium">Date opened by me</span>
        <svg class="w-4 h-4 text-accentCyan" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"/></svg>
      </div>

      <div class="flex items-center gap-1 bg-sheetDark-800 p-1 rounded-lg">
        <button id="viewListBtn" onclick="setViewMode('list')" class="p-1.5 rounded hover:bg-sheetDark-700 text-[#8e918f]" title="List view">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>
        <button id="viewGridBtn" onclick="setViewMode('grid')" class="p-1.5 rounded bg-sheetDark-700 text-white" title="Grid view">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 5a1 1 0 011-1h4a1 1 0 011 1v4a1 1 0 01-1 1H5a1 1 0 01-1-1V5zm10 0a1 1 0 011-1h4a1 1 0 011 1v4a1 1 0 01-1 1h-4a1 1 0 01-1-1V5zM4 15a1 1 0 011-1h4a1 1 0 011 1v4a1 1 0 01-1 1H5a1 1 0 01-1-1v-4zm10 0a1 1 0 011-1h4a1 1 0 011 1v4a1 1 0 01-1 1h-4a1 1 0 01-1-1v-4z"/></svg>
        </button>
      </div>
    </div>

    <!-- Main Content Area: Files or Empty State -->
    <main class="flex-1 overflow-y-auto p-4 sm:p-8" id="filesContainer">
      <!-- Injected by JavaScript -->
    </main>

    <!-- Floating Action Button (FAB) -->
    <button onclick="createNewSpreadsheet()" class="fixed bottom-6 right-6 sm:bottom-8 sm:right-8 w-14 h-14 rounded-2xl bg-[#004d61] hover:bg-[#005f78] text-accentCyan shadow-2xl flex items-center justify-center transition-all hover:scale-105 active:scale-95 z-30" title="Create new spreadsheet">
      <svg class="w-7 h-7" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/></svg>
    </button>
  </div>


  <!-- ========================================== -->
  <!-- VIEW 2: SPREADSHEET EDITOR VIEW            -->
  <!-- ========================================== -->
  <div id="editorView" class="h-full w-full flex flex-col hidden bg-sheetDark-900">
    <!-- Editor Header Toolbar -->
    <header class="bg-sheetDark-800 border-b border-sheetDark-700 px-3 py-2 flex items-center justify-between gap-2">
      <div class="flex items-center gap-2 sm:gap-4 flex-1 min-w-0">
        <!-- Back to Dashboard button -->
        <button onclick="backToDashboard()" class="p-2 rounded-full hover:bg-sheetDark-700 text-[#e3e3e3]" title="Back to files">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M10 19l-7-7m0 0l7-7m-7 7h18"/></svg>
        </button>

        <!-- Spreadsheet Title with Inline Rename -->
        <div class="flex flex-col min-w-0">
          <div class="flex items-center gap-2 group cursor-pointer" onclick="openRenameModal(activeFile.id)">
            <input type="text" id="editorTitleInput" value="Untitled spreadsheet" 
                   onchange="handleHeaderTitleChange(this.value)"
                   class="bg-transparent text-base sm:text-lg font-medium text-white truncate border border-transparent hover:border-sheetDark-600 focus:border-accentCyan rounded px-1.5 py-0.5 outline-none max-w-[220px] sm:max-w-md">
            <svg class="w-3.5 h-3.5 text-[#8e918f] group-hover:text-accentCyan opacity-0 group-hover:opacity-100 transition-opacity" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"/></svg>
          </div>
          <span id="saveStatus" class="text-[11px] text-[#8e918f] pl-1.5">Saved locally</span>
        </div>
      </div>

      <!-- Action Buttons -->
      <div class="flex items-center gap-1 sm:gap-2">
        <button onclick="undo()" class="p-2 rounded-full hover:bg-sheetDark-700 text-[#c4c7c5]" title="Undo (Ctrl+Z)">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3 10h10a5 5 0 015 5v2m-15-7l4-4m-4 4l4 4"/></svg>
        </button>
        <button onclick="redo()" class="p-2 rounded-full hover:bg-sheetDark-700 text-[#c4c7c5]" title="Redo (Ctrl+Y)">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M21 10H11a5 5 0 00-5 5v2m15-7l-4-4m4 4l-4 4"/></svg>
        </button>

        <!-- Quick Format Button -->
        <button onclick="toggleFormatToolbar()" class="p-2 rounded-full hover:bg-sheetDark-700 text-[#c4c7c5]" title="Format text/cell">
          <svg class="w-5 h-5" viewBox="0 0 24 24" fill="currentColor">
            <path d="M5 18v-2h4.5l3.5-9h2l3.5 9H23v2H5zm7.2-4.5h3.6L14 8.7h-.2l-1.6 4.8zM2 4h10v2H2V4z"/>
          </svg>
        </button>

        <!-- Insert element (+) -->
        <button onclick="openInsertModal()" class="p-2 rounded-full hover:bg-sheetDark-700 text-[#c4c7c5]" title="Insert">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/></svg>
        </button>

        <!-- Export CSV button -->
        <button onclick="exportCSV()" class="hidden sm:flex items-center gap-1.5 bg-sheetDark-700 hover:bg-sheetDark-600 px-3 py-1.5 rounded-full text-xs font-medium text-white transition-colors" title="Export CSV">
          <svg class="w-4 h-4 text-accentCyan" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>
          Export
        </button>

        <!-- Context menu -->
        <div class="relative">
          <button onclick="toggleEditorMenu()" class="p-2 rounded-full hover:bg-sheetDark-700 text-[#c4c7c5]" title="More options">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 5v.01M12 12v.01M12 19v.01M12 6a1 1 0 110-2 1 1 0 010 2zm0 7a1 1 0 110-2 1 1 0 010 2zm0 7a1 1 0 110-2 1 1 0 010 2z"/></svg>
          </button>
          
          <!-- Dropdown menu -->
          <div id="editorDropdown" class="hidden absolute right-0 mt-2 w-48 bg-sheetDark-800 border border-sheetDark-700 rounded-xl shadow-2xl py-2 z-50">
            <button onclick="openRenameModal(activeFile.id); toggleEditorMenu()" class="w-full text-left px-4 py-2 text-sm text-[#e3e3e3] hover:bg-sheetDark-700 flex items-center gap-3">
              <svg class="w-4 h-4 text-[#8e918f]" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/></svg>
              Rename file
            </button>
            <button onclick="exportCSV(); toggleEditorMenu()" class="w-full text-left px-4 py-2 text-sm text-[#e3e3e3] hover:bg-sheetDark-700 flex items-center gap-3">
              <svg class="w-4 h-4 text-[#8e918f]" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
              Download CSV
            </button>
            <div class="h-[1px] bg-sheetDark-700 my-1"></div>
            <button onclick="deleteActiveFile(); toggleEditorMenu()" class="w-full text-left px-4 py-2 text-sm text-red-400 hover:bg-sheetDark-700 flex items-center gap-3">
              <svg class="w-4 h-4 text-red-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
              Delete spreadsheet
            </button>
          </div>
        </div>
      </div>
    </header>

    <!-- Formula Bar -->
    <div class="bg-sheetDark-800 border-b border-sheetDark-700 px-3 py-1.5 flex items-center gap-3 text-sm">
      <div id="activeCellAddress" class="text-xs font-mono font-bold text-accentCyan w-10 text-center bg-sheetDark-900 py-1 rounded border border-sheetDark-600">
        A1
      </div>
      <div class="text-[#8e918f] font-serif italic text-base select-none">
        fx
      </div>
      <input type="text" id="formulaInput" placeholder="Enter text or formula (e.g. =SUM(A1:A5))"
             oninput="handleFormulaInput(this.value)"
             onkeydown="handleFormulaKeydown(event)"
             class="flex-1 bg-sheetDark-900 text-[#e3e3e3] border border-sheetDark-600 rounded-lg px-3 py-1 text-sm outline-none focus:border-accentCyan placeholder-[#6e7278]">
      <button onclick="commitCellEdit()" class="p-1.5 rounded bg-sheetDark-700 text-accentCyan hover:bg-sheetDark-600" title="Apply">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/></svg>
      </button>
    </div>

    <!-- Desktop Formatting Toolbar -->
    <div id="formatToolbar" class="bg-sheetDark-800 border-b border-sheetDark-700 px-3 py-1.5 flex items-center gap-1 sm:gap-2 overflow-x-auto text-xs text-[#c4c7c5]">
      <button onclick="formatCell('bold')" id="btnBold" class="p-1.5 rounded hover:bg-sheetDark-700 font-bold" title="Bold (Ctrl+B)">B</button>
      <button onclick="formatCell('italic')" id="btnItalic" class="p-1.5 rounded hover:bg-sheetDark-700 italic" title="Italic (Ctrl+I)">I</button>
      <button onclick="formatCell('strikethrough')" id="btnStrike" class="p-1.5 rounded hover:bg-sheetDark-700 line-through" title="Strikethrough">S</button>
      
      <div class="h-4 w-[1px] bg-sheetDark-600 mx-1"></div>

      <button onclick="formatCell('align', 'left')" class="p-1.5 rounded hover:bg-sheetDark-700" title="Align Left">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h10M4 18h14"/></svg>
      </button>
      <button onclick="formatCell('align', 'center')" class="p-1.5 rounded hover:bg-sheetDark-700" title="Align Center">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M7 12h10M5 18h14"/></svg>
      </button>
      <button onclick="formatCell('align', 'right')" class="p-1.5 rounded hover:bg-sheetDark-700" title="Align Right">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M10 12h10M6 18h14"/></svg>
      </button>

      <div class="h-4 w-[1px] bg-sheetDark-600 mx-1"></div>

      <!-- Text Color Picker -->
      <label class="p-1.5 rounded hover:bg-sheetDark-700 cursor-pointer flex items-center gap-1" title="Text Color">
        <span class="font-bold underline decoration-accentCyan">A</span>
        <input type="color" onchange="formatCell('color', this.value)" class="w-0 h-0 opacity-0 absolute">
      </label>

      <!-- Fill Color Picker -->
      <label class="p-1.5 rounded hover:bg-sheetDark-700 cursor-pointer flex items-center gap-1" title="Fill Color">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"/></svg>
        <input type="color" onchange="formatCell('bgColor', this.value)" class="w-0 h-0 opacity-0 absolute">
      </label>

      <div class="h-4 w-[1px] bg-sheetDark-600 mx-1"></div>

      <!-- Quick Functions -->
      <div class="hidden sm:flex items-center gap-1">
        <button onclick="insertFormulaTemplate('SUM')" class="px-2 py-1 rounded bg-sheetDark-700 hover:bg-sheetDark-600 text-[11px] font-mono">SUM</button>
        <button onclick="insertFormulaTemplate('AVERAGE')" class="px-2 py-1 rounded bg-sheetDark-700 hover:bg-sheetDark-600 text-[11px] font-mono">AVG</button>
        <button onclick="insertFormulaTemplate('COUNT')" class="px-2 py-1 rounded bg-sheetDark-700 hover:bg-sheetDark-600 text-[11px] font-mono">COUNT</button>
      </div>

      <div class="flex-1"></div>

      <button onclick="clearCellFormat()" class="px-2 py-1 rounded hover:bg-sheetDark-700 text-[#8e918f] hover:text-white" title="Clear Formatting">
        Reset format
      </button>
    </div>

    <!-- Spreadsheet Main Grid Area -->
    <div id="gridScrollContainer" class="flex-1 overflow-auto bg-sheetDark-900 relative">
      <table id="sheetTable" class="grid-table w-full text-xs text-[#e3e3e3]">
        <!-- Injected by JavaScript -->
      </table>
    </div>

    <!-- Bottom Sheet Tabs Bar -->
    <footer class="bg-sheetDark-800 border-t border-sheetDark-700 px-3 py-1.5 flex items-center justify-between z-20">
      <div class="flex items-center gap-2 overflow-x-auto max-w-[80vw]">
        <button onclick="showSheetsListModal()" class="p-1.5 rounded hover:bg-sheetDark-700 text-[#c4c7c5]" title="All sheets">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>

        <div id="sheetTabsContainer" class="flex items-center gap-1">
          <!-- Injected by JavaScript -->
        </div>

        <button onclick="addNewSheetTab()" class="p-1.5 rounded-full hover:bg-sheetDark-700 text-[#c4c7c5]" title="Add sheet">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/></svg>
        </button>
      </div>

      <div id="gridQuickStats" class="hidden md:flex items-center gap-4 text-xs font-mono text-[#9aa0a6] px-3">
        <span>SUM: <b id="statSum" class="text-white">0</b></span>
        <span>COUNT: <b id="statCount" class="text-white">0</b></span>
      </div>
    </footer>
  </div>


  <!-- ========================================== -->
  <!-- MODALS & DIALOGS                           -->
  <!-- ========================================== -->

  <!-- Generic Rename Modal -->
  <div id="renameModal" class="fixed inset-0 bg-black/60 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
    <div class="bg-sheetDark-800 border border-sheetDark-700 rounded-2xl p-6 w-full max-w-sm shadow-2xl">
      <h3 class="text-lg font-medium text-white mb-2">Rename spreadsheet</h3>
      <p class="text-xs text-[#8e918f] mb-4">Please enter a new name for the file:</p>
      <input type="text" id="renameModalInput" class="w-full bg-sheetDark-900 border border-sheetDark-600 rounded-lg px-3 py-2 text-sm text-white focus:border-accentCyan outline-none mb-6">
      <div class="flex justify-end gap-3">
        <button onclick="closeRenameModal()" class="px-4 py-2 text-sm font-medium text-[#8e918f] hover:text-white rounded-lg">Cancel</button>
        <button onclick="confirmRename()" class="px-4 py-2 text-sm font-medium bg-accentCyan text-accentCyan-text hover:bg-[#8ee0f0] rounded-lg font-semibold">OK</button>
      </div>
    </div>
  </div>

  <!-- Delete Confirmation Modal -->
  <div id="deleteModal" class="fixed inset-0 bg-black/60 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
    <div class="bg-sheetDark-800 border border-sheetDark-700 rounded-2xl p-6 w-full max-w-sm shadow-2xl">
      <div class="w-12 h-12 rounded-full bg-red-950/60 border border-red-800/50 text-red-400 flex items-center justify-center mb-4">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
      </div>
      <h3 class="text-lg font-medium text-white mb-1">Delete spreadsheet?</h3>
      <p class="text-xs text-[#8e918f] mb-6">"<span id="deleteFileName" class="text-white font-medium"></span>" will be deleted permanently from your device storage.</p>
      <div class="flex justify-end gap-3">
        <button onclick="closeDeleteModal()" class="px-4 py-2 text-sm font-medium text-[#8e918f] hover:text-white rounded-lg">Cancel</button>
        <button onclick="confirmDelete()" class="px-4 py-2 text-sm font-medium bg-red-500 hover:bg-red-600 text-white rounded-lg font-semibold">Delete</button>
      </div>
    </div>
  </div>

  <!-- Tab Context Menu -->
  <div id="tabContextMenu" class="fixed bg-sheetDark-800 border border-sheetDark-700 rounded-xl shadow-2xl py-2 hidden z-50 w-44">
    <button onclick="renameActiveSheetTab()" class="w-full text-left px-4 py-2 text-sm text-[#e3e3e3] hover:bg-sheetDark-700 flex items-center gap-2">
      <svg class="w-4 h-4 text-[#8e918f]" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/></svg>
      Rename sheet
    </button>
    <button onclick="deleteActiveSheetTab()" class="w-full text-left px-4 py-2 text-sm text-red-400 hover:bg-sheetDark-700 flex items-center gap-2">
      <svg class="w-4 h-4 text-red-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
      Delete sheet
    </button>
  </div>


  <!-- ========================================== -->
  <!-- JAVASCRIPT LOGIC                           -->
  <!-- ========================================== -->
  <script>
    /* ----------------------------------------------------
       State & Storage Architecture
    ----------------------------------------------------- */
    const STORAGE_KEY = 'google_sheets_clone_storage_v3';
    const ROWS_COUNT = 50;
    const COLS_COUNT = 20;

    let files = [];
    let activeFile = null;
    let activeSheetIndex = 0;
    let selectedCell = { r: 1, c: 1 };
    let isEditingCell = false;
    let viewMode = 'grid';
    let sortDirection = 'desc';
    let targetFileIdForAction = null;

    let undoStack = [];
    let redoStack = [];

    /* Helper: Returns the exact Google Sheets icon SVG from your image */
    function getSheetsIconSvg(sizeClass = "w-6 h-6", rx = "10") {
      return `
        <svg viewBox="0 0 48 48" class="${sizeClass} shrink-0" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect width="48" height="48" rx="${rx}" fill="#0fa958"/>
          <!-- Precise cross grid lines matching Google Sheets screenshot -->
          <line x1="12" y1="18.5" x2="38" y2="18.5" stroke="white" stroke-width="5" stroke-linecap="round"/>
          <line x1="18.5" y1="12" x2="18.5" y2="38" stroke="white" stroke-width="5" stroke-linecap="round"/>
        </svg>
      `;
    }

    /* Start empty */
    function initSeedData() {
      const stored = localStorage.getItem(STORAGE_KEY);
      if (stored) {
        try {
          files = JSON.parse(stored);
          return;
        } catch (e) {
          console.error("Failed to parse storage", e);
        }
      }
      files = [];
      saveToStorage();
    }

    function saveToStorage() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(files));
      const status = document.getElementById('saveStatus');
      if (status) {
        status.innerText = "All changes saved";
      }
    }

    /* ----------------------------------------------------
       Dashboard UI Logic
    ----------------------------------------------------- */
    function renderDashboard() {
      const container = document.getElementById('filesContainer');
      const searchQuery = (document.getElementById('searchInput')?.value || '').trim().toLowerCase();
      
      let filtered = files.filter(f => f.title.toLowerCase().includes(searchQuery));
      filtered.sort((a, b) => sortDirection === 'desc' ? b.updatedAt - a.updatedAt : a.updatedAt - b.updatedAt);

      // If empty: Render the empty illustration
      if (filtered.length === 0) {
        container.innerHTML = `
          <div class="h-full flex flex-col items-center justify-center text-center p-6 mt-4">
            <div class="w-64 h-64 sm:w-72 sm:h-72 relative flex items-center justify-center mb-6">
              <svg viewBox="0 0 300 300" class="w-full h-full" fill="none" xmlns="http://www.w3.org/2000/svg">
                <circle cx="150" cy="150" r="110" fill="#1b1d20" />
                <path d="M120 70 C140 50, 160 50, 180 70" stroke="#78d9ec" stroke-width="2" stroke-linecap="round"/>
                <rect x="70" y="85" width="48" height="60" rx="6" fill="#1e3a47" stroke="#78d9ec" stroke-width="1.5" />
                <line x1="78" y1="98" x2="98" y2="98" stroke="#78d9ec" stroke-width="2" stroke-linecap="round"/>
                <line x1="78" y1="108" x2="108" y2="108" stroke="#78d9ec" stroke-width="2" stroke-linecap="round"/>
                <rect x="180" y="95" width="48" height="60" rx="6" fill="#123d24" stroke="#0fa958" stroke-width="1.5" />
                <rect x="187" y="104" width="34" height="20" rx="2" fill="#0fa958" fill-opacity="0.2" stroke="#0fa958" stroke-width="1" />
                <line x1="204" y1="104" x2="204" y2="124" stroke="#0fa958" stroke-width="1"/>
                <line x1="187" y1="114" x2="221" y2="114" stroke="#0fa958" stroke-width="1"/>
                <path d="M135 110 C135 90, 190 90, 185 130 C185 155, 175 160, 150 160 C135 160, 135 135, 135 110 Z" fill="#9e4c34"/>
                <circle cx="150" cy="120" r="18" fill="#e09f7a"/>
                <rect x="122" y="130" width="56" height="70" rx="8" fill="#ffffff" filter="drop-shadow(0px 8px 12px rgba(0,0,0,0.5))"/>
                <circle cx="150" cy="162" r="14" fill="#fde293"/>
                <path d="M144 162 L148 166 L156 158" stroke="#b06000" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M100 170 Q122 140 135 145" stroke="#e09f7a" stroke-width="9" stroke-linecap="round"/>
                <path d="M200 170 Q178 140 165 145" stroke="#e09f7a" stroke-width="9" stroke-linecap="round"/>
              </svg>
            </div>
            
            <h2 class="text-xl sm:text-2xl font-normal text-white mb-2">No recent files</h2>
            <p class="text-sm text-[#8e918f] max-w-sm mb-6">See all files you've recently edited or opened</p>
            <button onclick="createNewSpreadsheet()" class="px-5 py-2.5 rounded-full bg-accentCyan text-accentCyan-text font-medium text-sm hover:bg-[#8ee0f0] transition-transform active:scale-95">
              Create spreadsheet
            </button>
          </div>
        `;
        return;
      }

      // Render Grid View matching the uploaded image card
      if (viewMode === 'grid') {
        container.innerHTML = `
          <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6 gap-4">
            ${filtered.map(f => `
              <div onclick="openSpreadsheet('${f.id}')" class="group bg-sheetDark-800 hover:bg-sheetDark-700 border border-sheetDark-700 hover:border-sheetDark-600 rounded-2xl p-3 flex flex-col justify-between cursor-pointer transition-all hover:shadow-xl relative aspect-[4/4]">
                <!-- Top Card Header: Small Logo + Title in English + 3 Dots -->
                <div class="flex items-start justify-between gap-1">
                  <div class="flex items-center gap-2.5 min-w-0">
                    <!-- New Exact Green Sheets Icon -->
                    ${getSheetsIconSvg("w-6 h-6", "10")}
                    <span class="text-sm font-medium text-[#e3e3e3] line-clamp-2 leading-snug group-hover:text-white" title="${escapeHtml(f.title)}">
                      ${escapeHtml(f.title)}
                    </span>
                  </div>
                  
                  <button onclick="event.stopPropagation(); openFileMenu(event, '${f.id}')" class="p-1.5 -mr-1 rounded-full text-[#8e918f] hover:text-white hover:bg-sheetDark-600">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 5v.01M12 12v.01M12 19v.01M12 6a1 1 0 110-2 1 1 0 010 2zm0 7a1 1 0 110-2 1 1 0 010 2zm0 7a1 1 0 110-2 1 1 0 010 2z"/></svg>
                  </button>
                </div>

                <!-- Preview Thumbnail: Large exact green logo + circular badge -->
                <div class="w-full flex-1 my-3 bg-[#131517] rounded-xl flex items-center justify-center border border-sheetDark-600/40 relative overflow-hidden">
                  <!-- Large Centered Logo -->
                  ${getSheetsIconSvg("w-14 h-14", "12")}

                  <!-- Offline Available Check Badge (from image) -->
                  <div class="absolute top-2.5 right-2.5 w-6 h-6 rounded-full bg-[#53575e] flex items-center justify-center shadow-md">
                    <svg class="w-3.5 h-3.5 text-[#131517]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                      <polyline points="20 6 9 17 4 12"></polyline>
                    </svg>
                  </div>
                </div>

                <!-- Date Info in English -->
                <div class="text-[11px] text-[#8e918f]">
                  Opened ${formatDate(f.updatedAt)}
                </div>
              </div>
            `).join('')}
          </div>
        `;
      } else {
        // List View
        container.innerHTML = `
          <div class="flex flex-col bg-sheetDark-800 rounded-2xl border border-sheetDark-700 divide-y divide-sheetDark-700 overflow-hidden">
            ${filtered.map(f => `
              <div onclick="openSpreadsheet('${f.id}')" class="flex items-center justify-between p-3.5 hover:bg-sheetDark-700/60 cursor-pointer transition-colors">
                <div class="flex items-center gap-3 min-w-0">
                  ${getSheetsIconSvg("w-7 h-7", "8")}
                  <div class="flex flex-col min-w-0">
                    <span class="text-sm font-medium text-white truncate">${escapeHtml(f.title)}</span>
                    <span class="text-xs text-[#8e918f]">Opened ${formatDate(f.updatedAt)}</span>
                  </div>
                </div>
                <div class="flex items-center gap-2">
                  <button onclick="event.stopPropagation(); openFileMenu(event, '${f.id}')" class="p-2 rounded-full text-[#8e918f] hover:text-white hover:bg-sheetDark-600">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 5v.01M12 12v.01M12 19v.01M12 6a1 1 0 110-2 1 1 0 010 2zm0 7a1 1 0 110-2 1 1 0 010 2zm0 7a1 1 0 110-2 1 1 0 010 2z"/></svg>
                  </button>
                </div>
              </div>
            `).join('')}
          </div>
        `;
      }
    }

    function setViewMode(mode) {
      viewMode = mode;
      document.getElementById('viewGridBtn').className = mode === 'grid' ? 'p-1.5 rounded bg-sheetDark-700 text-white' : 'p-1.5 rounded hover:bg-sheetDark-700 text-[#8e918f]';
      document.getElementById('viewListBtn').className = mode === 'list' ? 'p-1.5 rounded bg-sheetDark-700 text-white' : 'p-1.5 rounded hover:bg-sheetDark-700 text-[#8e918f]';
      renderDashboard();
    }

    function toggleSort() {
      sortDirection = sortDirection === 'desc' ? 'asc' : 'desc';
      document.getElementById('sortLabel').innerText = sortDirection === 'desc' ? 'Date opened by me' : 'Oldest first';
      renderDashboard();
    }

    /* ----------------------------------------------------
       File Creation, Renaming & Deleting
    ----------------------------------------------------- */
    function createNewSpreadsheet() {
      const newFile = {
        id: 'file_' + Date.now(),
        title: 'Untitled spreadsheet',
        createdAt: Date.now(),
        updatedAt: Date.now(),
        sheets: [
          {
            id: 'sheet_' + Date.now(),
            name: 'Sheet1',
            cells: {}
          }
        ]
      };
      files.unshift(newFile);
      saveToStorage();
      openSpreadsheet(newFile.id);
    }

    function openSpreadsheet(id) {
      activeFile = files.find(f => f.id === id);
      if (!activeFile) return;

      activeFile.updatedAt = Date.now();
      saveToStorage();

      activeSheetIndex = 0;
      selectedCell = { r: 1, c: 1 };
      undoStack = [];
      redoStack = [];

      document.getElementById('dashboardView').classList.add('hidden');
      document.getElementById('editorView').classList.remove('hidden');

      document.getElementById('editorTitleInput').value = activeFile.title;

      renderEditorGrid();
      renderSheetTabs();
      updateFormulaBarForSelectedCell();
    }

    function backToDashboard() {
      saveToStorage();
      document.getElementById('editorView').classList.add('hidden');
      document.getElementById('dashboardView').classList.remove('hidden');
      renderDashboard();
    }

    // Rename Logic
    function openRenameModal(fileId) {
      targetFileIdForAction = fileId;
      const file = files.find(f => f.id === fileId);
      if (!file) return;

      const input = document.getElementById('renameModalInput');
      input.value = file.title;
      document.getElementById('renameModal').classList.remove('hidden');
      document.getElementById('renameModal').classList.add('flex');
      setTimeout(() => {
        input.focus();
        input.select();
      }, 50);
    }

    function closeRenameModal() {
      document.getElementById('renameModal').classList.add('hidden');
      document.getElementById('renameModal').classList.remove('flex');
      targetFileIdForAction = null;
    }

    function confirmRename() {
      const input = document.getElementById('renameModalInput');
      const newName = input.value.trim() || 'Untitled spreadsheet';
      
      const file = files.find(f => f.id === targetFileIdForAction);
      if (file) {
        file.title = newName;
        file.updatedAt = Date.now();
        saveToStorage();

        if (activeFile && activeFile.id === file.id) {
          document.getElementById('editorTitleInput').value = newName;
        }
        renderDashboard();
      }
      closeRenameModal();
    }

    function handleHeaderTitleChange(val) {
      if (!activeFile) return;
      activeFile.title = val.trim() || 'Untitled spreadsheet';
      activeFile.updatedAt = Date.now();
      saveToStorage();
    }

    // Delete Logic
    function openDeleteModal(fileId) {
      targetFileIdForAction = fileId;
      const file = files.find(f => f.id === fileId);
      if (!file) return;

      document.getElementById('deleteFileName').innerText = file.title;
      document.getElementById('deleteModal').classList.remove('hidden');
      document.getElementById('deleteModal').classList.add('flex');
    }

    function closeDeleteModal() {
      document.getElementById('deleteModal').classList.add('hidden');
      document.getElementById('deleteModal').classList.remove('flex');
      targetFileIdForAction = null;
    }

    function confirmDelete() {
      if (!targetFileIdForAction) return;
      
      const fileId = targetFileIdForAction;
      files = files.filter(f => f.id !== fileId);
      saveToStorage();
      closeDeleteModal();

      if (activeFile && activeFile.id === fileId) {
        backToDashboard();
      } else {
        renderDashboard();
      }
    }

    function deleteActiveFile() {
      if (activeFile) {
        openDeleteModal(activeFile.id);
      }
    }

    // Context Popups
    function openFileMenu(e, fileId) {
      const rect = e.currentTarget.getBoundingClientRect();
      const existing = document.getElementById('dynamicFileMenu');
      if (existing) existing.remove();

      const menu = document.createElement('div');
      menu.id = 'dynamicFileMenu';
      menu.className = 'fixed bg-sheetDark-800 border border-sheetDark-700 rounded-xl shadow-2xl py-2 z-50 w-48 text-sm';
      menu.style.top = `${rect.bottom + 4}px`;
      menu.style.left = `${Math.min(window.innerWidth - 200, rect.left)}px`;

      menu.innerHTML = `
        <button onclick="openRenameModal('${fileId}'); document.getElementById('dynamicFileMenu').remove();" class="w-full text-left px-4 py-2 hover:bg-sheetDark-700 flex items-center gap-2.5 text-[#e3e3e3]">
          <svg class="w-4 h-4 text-[#8e918f]" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/></svg>
          Rename
        </button>
        <button onclick="duplicateFile('${fileId}'); document.getElementById('dynamicFileMenu').remove();" class="w-full text-left px-4 py-2 hover:bg-sheetDark-700 flex items-center gap-2.5 text-[#e3e3e3]">
          <svg class="w-4 h-4 text-[#8e918f]" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"/></svg>
          Make a copy
        </button>
        <div class="h-[1px] bg-sheetDark-700 my-1"></div>
        <button onclick="openDeleteModal('${fileId}'); document.getElementById('dynamicFileMenu').remove();" class="w-full text-left px-4 py-2 hover:bg-sheetDark-700 flex items-center gap-2.5 text-red-400">
          <svg class="w-4 h-4 text-red-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
          Delete
        </button>
      `;

      document.body.appendChild(menu);

      const closeHandler = (ev) => {
        if (!menu.contains(ev.target)) {
          menu.remove();
          document.removeEventListener('click', closeHandler);
        }
      };
      setTimeout(() => document.addEventListener('click', closeHandler), 10);
    }

    function duplicateFile(fileId) {
      const file = files.find(f => f.id === fileId);
      if (!file) return;

      const copy = JSON.parse(JSON.stringify(file));
      copy.id = 'file_' + Date.now();
      copy.title = 'Copy of ' + file.title;
      copy.createdAt = Date.now();
      copy.updatedAt = Date.now();
      files.unshift(copy);
      saveToStorage();
      renderDashboard();
    }

    /* ----------------------------------------------------
       Spreadsheet Grid Engine & Formula Calculator
    ----------------------------------------------------- */
    function colNumberToName(n) {
      let s = '';
      while (n > 0) {
        let m = (n - 1) % 26;
        s = String.fromCharCode(65 + m) + s;
        n = Math.floor((n - m) / 26);
      }
      return s;
    }

    function colNameToNumber(s) {
      let n = 0;
      for (let i = 0; i < s.length; i++) {
        n = n * 26 + s.charCodeAt(i) - 64;
      }
      return n;
    }

    function getCellKey(r, c) {
      return `${colNumberToName(c)}${r}`;
    }

    function getActiveSheet() {
      if (!activeFile || !activeFile.sheets[activeSheetIndex]) return null;
      return activeFile.sheets[activeSheetIndex];
    }

    function renderEditorGrid() {
      const table = document.getElementById('sheetTable');
      const sheet = getActiveSheet();
      if (!sheet) return;

      let html = '<thead><tr>';
      html += '<th class="header-cell w-10 min-w-10 sticky top-0 left-0 z-30 text-center bg-[#181a1d]">#</th>';
      
      for (let c = 1; c <= COLS_COUNT; c++) {
        html += `<th class="header-cell w-28 min-w-28 py-1.5 text-center sticky top-0 z-20">${colNumberToName(c)}</th>`;
      }
      html += '</tr></thead><tbody>';

      for (let r = 1; r <= ROWS_COUNT; r++) {
        html += '<tr>';
        html += `<td class="header-cell sticky left-0 z-10 text-center font-mono py-1">${r}</td>`;
        
        for (let c = 1; c <= COLS_COUNT; c++) {
          const key = getCellKey(r, c);
          const cell = sheet.cells[key] || {};
          const displayVal = evaluateCell(key, sheet);
          const style = getCellStyleString(cell.style);

          html += `
            <td id="cell_${r}_${c}" 
                onclick="selectCell(${r}, ${c})"
                ondblclick="editCellInline(${r}, ${c})"
                style="${style}"
                class="grid-cell px-2 py-1.5 cursor-cell h-7 min-w-28">
              ${escapeHtml(displayVal)}
            </td>
          `;
        }
        html += '</tr>';
      }
      html += '</tbody>';
      table.innerHTML = html;

      highlightActiveCell();
    }

    function getCellStyleString(style = {}) {
      let css = '';
      if (style.bold) css += 'font-weight: 700; ';
      if (style.italic) css += 'font-style: italic; ';
      if (style.strikethrough) css += 'text-decoration: line-through; ';
      if (style.align) css += `text-align: ${style.align}; `;
      if (style.color) css += `color: ${style.color}; `;
      if (style.bgColor) css += `background-color: ${style.bgColor}; `;
      return css;
    }

    function evaluateCell(key, sheet, visited = new Set()) {
      const cell = sheet.cells[key];
      if (!cell || cell.raw === undefined || cell.raw === null) return '';
      const val = cell.raw.toString();

      if (!val.startsWith('=')) {
        return val;
      }

      if (visited.has(key)) return '#REF!';
      visited.add(key);

      try {
        const expression = val.slice(1).trim().toUpperCase();

        if (expression.startsWith('SUM(') && expression.endsWith(')')) {
          const range = expression.slice(4, -1);
          const values = getRangeValues(range, sheet, visited);
          return values.reduce((acc, curr) => acc + (parseFloat(curr) || 0), 0);
        }

        if (expression.startsWith('AVERAGE(') && expression.endsWith(')')) {
          const range = expression.slice(8, -1);
          const values = getRangeValues(range, sheet, visited).map(v => parseFloat(v)).filter(v => !isNaN(v));
          if (!values.length) return 0;
          return (values.reduce((a, b) => a + b, 0) / values.length).toFixed(2).replace(/\.00$/, '');
        }

        if (expression.startsWith('COUNT(') && expression.endsWith(')')) {
          const range = expression.slice(6, -1);
          const values = getRangeValues(range, sheet, visited).map(v => parseFloat(v)).filter(v => !isNaN(v));
          return values.length;
        }

        const sanitized = expression.replace(/([A-Z]+[0-9]+)/g, (match) => {
          const resolved = evaluateCell(match, sheet, new Set(visited));
          const num = parseFloat(resolved);
          return isNaN(num) ? 0 : num;
        });

        if (/^[\d\s+\-*/().]+$/.test(sanitized)) {
          const result = Function(`'use strict'; return (${sanitized})`)();
          return typeof result === 'number' ? (Math.round(result * 100) / 100) : result;
        }

        return '#VALUE!';
      } catch (err) {
        return '#ERROR!';
      }
    }

    function getRangeValues(rangeStr, sheet, visited) {
      const parts = rangeStr.split(':');
      if (parts.length !== 2) {
        return [evaluateCell(rangeStr.trim(), sheet, visited)];
      }

      const match1 = parts[0].trim().match(/^([A-Z]+)([0-9]+)$/);
      const match2 = parts[1].trim().match(/^([A-Z]+)([0-9]+)$/);
      if (!match1 || !match2) return [];

      const startCol = colNameToNumber(match1[1]);
      const startRow = parseInt(match1[2], 10);
      const endCol = colNameToNumber(match2[1]);
      const endRow = parseInt(match2[2], 10);

      const rMin = Math.min(startRow, endRow);
      const rMax = Math.max(startRow, endRow);
      const cMin = Math.min(startCol, endCol);
      const cMax = Math.max(startCol, endCol);

      const values = [];
      for (let r = rMin; r <= rMax; r++) {
        for (let c = cMin; c <= cMax; c++) {
          const k = getCellKey(r, c);
          values.push(evaluateCell(k, sheet, visited));
        }
      }
      return values;
    }

    /* ----------------------------------------------------
       Selection & Active Cell Editing
    ----------------------------------------------------- */
    function selectCell(r, c) {
      if (isEditingCell) commitCellEdit();

      selectedCell = { r, c };
      highlightActiveCell();
      updateFormulaBarForSelectedCell();
      updateQuickStats();
    }

    function highlightActiveCell() {
      document.querySelectorAll('.cell-selected').forEach(el => el.classList.remove('cell-selected'));
      const td = document.getElementById(`cell_${selectedCell.r}_${selectedCell.c}`);
      if (td) {
        td.classList.add('cell-selected');
      }
      document.getElementById('activeCellAddress').innerText = getCellKey(selectedCell.r, selectedCell.c);
    }

    function updateFormulaBarForSelectedCell() {
      const sheet = getActiveSheet();
      const key = getCellKey(selectedCell.r, selectedCell.c);
      const cell = sheet?.cells[key];
      const formulaInput = document.getElementById('formulaInput');
      formulaInput.value = cell?.raw || '';
    }

    function editCellInline(r, c) {
      selectCell(r, c);
      const td = document.getElementById(`cell_${r}_${c}`);
      const sheet = getActiveSheet();
      const key = getCellKey(r, c);
      const rawVal = sheet.cells[key]?.raw || '';

      isEditingCell = true;
      td.innerHTML = `
        <input id="inlineInput" type="text" class="w-full h-full bg-sheetDark-900 text-white outline-none border-none p-0 text-xs" value="${escapeHtml(rawVal)}">
      `;
      const input = document.getElementById('inlineInput');
      input.focus();
      input.select();

      input.onkeydown = (e) => {
        if (e.key === 'Enter') {
          commitCellEdit(input.value);
          selectCell(Math.min(ROWS_COUNT, r + 1), c);
        } else if (e.key === 'Escape') {
          isEditingCell = false;
          renderEditorGrid();
        } else if (e.key === 'Tab') {
          e.preventDefault();
          commitCellEdit(input.value);
          selectCell(r, Math.min(COLS_COUNT, c + 1));
        }
      };

      input.onblur = () => {
        if (isEditingCell) {
          commitCellEdit(input.value);
        }
      };
    }

    function handleFormulaInput(val) {
      const sheet = getActiveSheet();
      const key = getCellKey(selectedCell.r, selectedCell.c);
      if (!sheet.cells[key]) sheet.cells[key] = {};
      sheet.cells[key].raw = val;

      const td = document.getElementById(`cell_${selectedCell.r}_${selectedCell.c}`);
      if (td && !isEditingCell) {
        td.innerText = val.startsWith('=') ? evaluateCell(key, sheet) : val;
      }
    }

    function handleFormulaKeydown(e) {
      if (e.key === 'Enter') {
        commitCellEdit();
        selectCell(Math.min(ROWS_COUNT, selectedCell.r + 1), selectedCell.c);
      }
    }

    function commitCellEdit(explicitVal) {
      isEditingCell = false;
      const sheet = getActiveSheet();
      const key = getCellKey(selectedCell.r, selectedCell.c);
      const formulaInput = document.getElementById('formulaInput');
      const val = explicitVal !== undefined ? explicitVal : formulaInput.value;

      if (!sheet.cells[key]) sheet.cells[key] = {};

      pushUndoState();

      sheet.cells[key].raw = val;
      activeFile.updatedAt = Date.now();
      saveToStorage();
      renderEditorGrid();
    }

    /* ----------------------------------------------------
       Formatting & Quick Tools
    ----------------------------------------------------- */
    function formatCell(type, value) {
      const sheet = getActiveSheet();
      const key = getCellKey(selectedCell.r, selectedCell.c);
      if (!sheet.cells[key]) sheet.cells[key] = { raw: '' };
      if (!sheet.cells[key].style) sheet.cells[key].style = {};

      pushUndoState();

      const st = sheet.cells[key].style;
      if (type === 'bold') st.bold = !st.bold;
      if (type === 'italic') st.italic = !st.italic;
      if (type === 'strikethrough') st.strikethrough = !st.strikethrough;
      if (type === 'align') st.align = value;
      if (type === 'color') st.color = value;
      if (type === 'bgColor') st.bgColor = value;

      saveToStorage();
      renderEditorGrid();
    }

    function clearCellFormat() {
      const sheet = getActiveSheet();
      const key = getCellKey(selectedCell.r, selectedCell.c);
      if (sheet.cells[key]) {
        pushUndoState();
        delete sheet.cells[key].style;
        saveToStorage();
        renderEditorGrid();
      }
    }

    function insertFormulaTemplate(fn) {
      const formulaInput = document.getElementById('formulaInput');
      formulaInput.value = `=${fn}(A1:A5)`;
      handleFormulaInput(formulaInput.value);
      formulaInput.focus();
    }

    function updateQuickStats() {
      const sheet = getActiveSheet();
      const key = getCellKey(selectedCell.r, selectedCell.c);
      const val = evaluateCell(key, sheet);
      const num = parseFloat(val);

      const statSum = document.getElementById('statSum');
      const statCount = document.getElementById('statCount');
      if (!isNaN(num)) {
        statSum.innerText = num;
        statCount.innerText = "1";
      } else if (val) {
        statSum.innerText = "-";
        statCount.innerText = "1";
      } else {
        statSum.innerText = "0";
        statCount.innerText = "0";
      }
    }

    /* ----------------------------------------------------
       Undo / Redo Architecture
    ----------------------------------------------------- */
    function pushUndoState() {
      if (!activeFile) return;
      undoStack.push(JSON.stringify(activeFile));
      if (undoStack.length > 30) undoStack.shift();
      redoStack = [];
    }

    function undo() {
      if (!undoStack.length) return;
      redoStack.push(JSON.stringify(activeFile));
      const previous = JSON.parse(undoStack.pop());
      Object.assign(activeFile, previous);
      saveToStorage();
      renderEditorGrid();
      renderSheetTabs();
    }

    function redo() {
      if (!redoStack.length) return;
      undoStack.push(JSON.stringify(activeFile));
      const next = JSON.parse(redoStack.pop());
      Object.assign(activeFile, next);
      saveToStorage();
      renderEditorGrid();
      renderSheetTabs();
    }

    /* ----------------------------------------------------
       Sheets Tabs Management
    ----------------------------------------------------- */
    function renderSheetTabs() {
      const container = document.getElementById('sheetTabsContainer');
      if (!activeFile) return;

      container.innerHTML = activeFile.sheets.map((sheet, idx) => {
        const isActive = idx === activeSheetIndex;
        if (isActive) {
          return `
            <div class="flex items-center gap-1.5 bg-accentCyan text-accentCyan-text px-3.5 py-1 rounded-full text-xs font-semibold cursor-pointer shadow">
              <span>${escapeHtml(sheet.name)}</span>
              <button onclick="event.stopPropagation(); openTabMenu(event, ${idx})" class="p-0.5 hover:bg-black/10 rounded">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"/></svg>
              </button>
            </div>
          `;
        } else {
          return `
            <button onclick="switchSheetTab(${idx})" class="px-3 py-1 rounded-full text-xs font-medium text-[#c4c7c5] hover:bg-sheetDark-700 hover:text-white transition-colors">
              ${escapeHtml(sheet.name)}
            </button>
          `;
        }
      }).join('');
    }

    function switchSheetTab(idx) {
      activeSheetIndex = idx;
      selectedCell = { r: 1, c: 1 };
      renderSheetTabs();
      renderEditorGrid();
      updateFormulaBarForSelectedCell();
    }

    function addNewSheetTab() {
      const sheetNumber = activeFile.sheets.length + 1;
      const newSheet = {
        id: 'sheet_' + Date.now(),
        name: `Sheet${sheetNumber}`,
        cells: {}
      };
      activeFile.sheets.push(newSheet);
      saveToStorage();
      switchSheetTab(activeFile.sheets.length - 1);
    }

    function openTabMenu(e, idx) {
      const menu = document.getElementById('tabContextMenu');
      const rect = e.currentTarget.getBoundingClientRect();
      menu.style.bottom = `${window.innerHeight - rect.top + 8}px`;
      menu.style.left = `${Math.min(window.innerWidth - 180, rect.left)}px`;
      menu.classList.remove('hidden');

      const closeTabMenu = (ev) => {
        if (!menu.contains(ev.target)) {
          menu.classList.add('hidden');
          document.removeEventListener('click', closeTabMenu);
        }
      };
      setTimeout(() => document.addEventListener('click', closeTabMenu), 10);
    }

    function renameActiveSheetTab() {
      const sheet = getActiveSheet();
      if (!sheet) return;
      const newName = prompt('Enter sheet name:', sheet.name);
      if (newName && newName.trim()) {
        sheet.name = newName.trim();
        saveToStorage();
        renderSheetTabs();
      }
      document.getElementById('tabContextMenu').classList.add('hidden');
    }

    function deleteActiveSheetTab() {
      if (activeFile.sheets.length <= 1) {
        alert("A spreadsheet must contain at least one sheet.");
        document.getElementById('tabContextMenu').classList.add('hidden');
        return;
      }
      if (confirm(`Delete '${getActiveSheet().name}'?`)) {
        activeFile.sheets.splice(activeSheetIndex, 1);
        activeSheetIndex = Math.max(0, activeSheetIndex - 1);
        saveToStorage();
        renderSheetTabs();
        renderEditorGrid();
      }
      document.getElementById('tabContextMenu').classList.add('hidden');
    }

    /* ----------------------------------------------------
       Export Utility
    ----------------------------------------------------- */
    function exportCSV() {
      const sheet = getActiveSheet();
      if (!sheet) return;

      let csv = '';
      for (let r = 1; r <= ROWS_COUNT; r++) {
        const rowVals = [];
        let hasContent = false;
        for (let c = 1; c <= COLS_COUNT; c++) {
          const key = getCellKey(r, c);
          const evaluated = evaluateCell(key, sheet);
          if (evaluated !== '') hasContent = true;
          rowVals.push(`"${evaluated.toString().replace(/"/g, '""')}"`);
        }
        if (hasContent || r <= 10) {
          csv += rowVals.join(',') + '\r\n';
        }
      }

      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.setAttribute('href', url);
      link.setAttribute('download', `${activeFile.title || 'Untitled spreadsheet'}.csv`);
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }

    /* ----------------------------------------------------
       Keyboard Nav & UI Controls
    ----------------------------------------------------- */
    window.addEventListener('keydown', (e) => {
      if (document.getElementById('renameModal').classList.contains('flex') ||
          document.getElementById('deleteModal').classList.contains('flex')) {
        return;
      }

      if (e.target.tagName === 'INPUT' && e.target.id !== 'inlineInput') {
        return;
      }

      if (document.getElementById('editorView').classList.contains('hidden')) {
        return;
      }

      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') {
        e.preventDefault();
        if (e.shiftKey) redo(); else undo();
        return;
      }
      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'y') {
        e.preventDefault();
        redo();
        return;
      }

      if (!isEditingCell) {
        if (e.key === 'ArrowDown') {
          e.preventDefault();
          selectCell(Math.min(ROWS_COUNT, selectedCell.r + 1), selectedCell.c);
        } else if (e.key === 'ArrowUp') {
          e.preventDefault();
          selectCell(Math.max(1, selectedCell.r - 1), selectedCell.c);
        } else if (e.key === 'ArrowRight' || e.key === 'Tab') {
          e.preventDefault();
          selectCell(selectedCell.r, Math.min(COLS_COUNT, selectedCell.c + 1));
        } else if (e.key === 'ArrowLeft') {
          e.preventDefault();
          selectCell(selectedCell.r, Math.max(1, selectedCell.c - 1));
        } else if (e.key === 'Delete' || e.key === 'Backspace') {
          const sheet = getActiveSheet();
          const key = getCellKey(selectedCell.r, selectedCell.c);
          if (sheet.cells[key]) {
            pushUndoState();
            delete sheet.cells[key];
            saveToStorage();
            renderEditorGrid();
            updateFormulaBarForSelectedCell();
          }
        } else if (e.key.length === 1 && !e.ctrlKey && !e.metaKey && !e.altKey) {
          editCellInline(selectedCell.r, selectedCell.c);
        }
      }
    });

    function toggleEditorMenu() {
      const drop = document.getElementById('editorDropdown');
      drop.classList.toggle('hidden');
    }

    function toggleFormatToolbar() {
      const tb = document.getElementById('formatToolbar');
      tb.classList.toggle('hidden');
    }

    function openInsertModal() {
      const choice = prompt("Insert element:\nType 'row' to insert row below\nType 'col' to insert column right");
      if (choice && choice.toLowerCase().includes('row')) {
        alert("Inserted new row reference!");
      }
    }

    function toggleSideMenu() {
      alert("Google Sheets - All documents are stored and synced locally in your browser storage.");
    }

    function formatDate(ms) {
      const date = new Date(ms);
      return date.toLocaleDateString('en-US', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
    }

    function escapeHtml(str) {
      if (!str) return '';
      return str.toString()
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    /* Init on page load */
    window.addEventListener('DOMContentLoaded', () => {
      initSeedData();
      renderDashboard();
    });
  </script>
</body>
